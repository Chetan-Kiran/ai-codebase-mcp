[project]
name = "ai-codebase-mcp"
version = "0.1.0"
description = "AI-powered MCP server for codebase analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.14.3",
    "gitpython>=3.1.50",
    "groq>=1.1.0",
    "mcp[cli]>=1.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
